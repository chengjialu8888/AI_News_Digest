<text x="86" y="251.74" fill="#111318" font-family="system-ui" font-size="58" font-weight="900" text-anchor="start" letter-spacing="0" >ent 行业开始重估“脚手架”</text>
<text x="88" y="482.0" fill="#332E27" font-family="system-ui" font-size="24" font-weight="520" text-anchor="start" letter-spacing="0" >本周主线不是 benchmark，而是 Agent 的管理范式变化：模型更成熟</text>
<text x="88" y="518.0" fill="#332E27" font-family="system-ui" font-size="24" font-weight="520" text-anchor="start" letter-spacing="0" >以后，提示词不再是堆规则，真正重要的是接口、边界、验证器、轨迹和</text>
<text x="88" y="554.0" fill="#332E27" font-family="system-ui" font-size="24" font-weight="520" text-anchor="start" letter-spacing="0" >全栈成本。</text>
<text x="1026" y="128" fill="#F7F0E5" font-family="system-ui" font-size="14" font-weight="850" text-anchor="start" letter-spacing="0" >FIRST-PRINCIPLES EQUATION</text>
<text x="1026" y="230.0" fill="#F7F0E5" font-family="system-ui" font-size="50" font-weight="900" text-anchor="start" letter-spacing="0" >把 Agent 当成熟员</text>
<text x="1026" y="281.0" fill="#F7F0E5" font-family="system-ui" font-size="50" font-weight="900" text-anchor="start" letter-spacing="0" >工管理</text>
<text x="1028" y="432" fill="#F7F0E5" font-family="monospace" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0" >agent_value =</text>
