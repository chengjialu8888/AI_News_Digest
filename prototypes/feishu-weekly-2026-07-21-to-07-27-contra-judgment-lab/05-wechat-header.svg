<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" aria-label="AI weekly judgment header"><rect x="0" y="0" width="1600" height="840" fill="#FBFAF6"/><text x="78" y="78" fill="#070707" font-size="18" font-weight="900" text-anchor="start">AI WEEKLY</text><text x="78" y="190" fill="#070707" font-size="62" font-weight="900" text-anchor="start">不再问谁最强，</text><text x="78" y="276" fill="#070707" font-size="62" font-weight="900" text-anchor="start">而要问谁更会判断。</text><text x="84" y="430" fill="#63615A" font-size="25" font-weight="550"><tspan x="84" dy="0">模型、harness、交付物和复盘，决定一个 Agent 能不能进入真实工作。</tspan></text><line x1="84" y1="650" x2="890" y2="650" stroke="#070707" stroke-width="3"/><text x="84" y="720" fill="#070707" font-size="17" font-weight="900" text-anchor="start">PROMPT</text><text x="280" y="720" fill="#070707" font-size="17" font-weight="900" text-anchor="start">HARNESS</text><text x="460" y="720" fill="#070707" font-size="17" font-weight="900" text-anchor="start">TASTE</text><rect x="1000" y="96" width="458" height="386" fill="#F0EEE7" stroke="#070707" stroke-width="2"/><rect x="1028" y="136" width="52" height="52" fill="#FF6B2C" stroke="#070707" stroke-width="2"/><rect x="1148" y="136" width="52" height="52" fill="#D7FF3F" stroke="#070707" stroke-width="2"/><rect x="1268" y="136" width="52" height="52" fill="#2F54FF" stroke="#070707" stroke-width="2"/><rect x="1028" y="236" width="52" height="52" fill="#18D68A" stroke="#070707" stroke-width="2"/><rect x="1148" y="236" width="52" height="52" fill="#B69CFF" stroke="#070707" stroke-width="2"/><rect x="1268" y="236" width="52" height="52" fill="#FF8BCB" stroke="#070707" stroke-width="2"/></svg>
