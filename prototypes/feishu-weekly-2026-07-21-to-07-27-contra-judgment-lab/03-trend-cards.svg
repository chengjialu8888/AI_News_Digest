<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1530" viewBox="0 0 1600 1530" aria-label="AI weekly judgment scorecards"><rect x="0" y="0" width="1600" height="1530" fill="#FBFAF6"/><text x="70" y="80" fill="#070707" font-size="18" font-weight="900" text-anchor="start">02 / SCORECARDS</text><text x="70" y="170" fill="#070707" font-size="52" font-weight="900" text-anchor="start">新闻只是材料，判断才是产物。</text><text x="74" y="248" fill="#63615A" font-size="21" font-weight="550" text-anchor="start">每张卡都保留：立场、证据、反问。</text><rect x="70" y="300" width="700" height="350" fill="#FBFAF6" stroke="#070707" stroke-width="2"/><rect x="104" y="328" width="52" height="52" fill="#FF6B2C" stroke="#070707" stroke-width="2"/><rect x="172" y="335" width="148" height="38" fill="#070707" stroke="#070707" stroke-width="2" rx="18"/><text x="246" y="361" fill="#FBFAF6" font-size="14" font-weight="900" text-anchor="middle">01 / 上下文</text><text x="730" y="364" fill="#070707" font-size="48" font-weight="900" text-anchor="end">92</text><text x="104" y="422" fill="#070707" font-size="25" font-weight="900"><tspan x="104" dy="0">上下文工程从写更多规则，变成授权成熟模型</tspan></text><text x="104" y="502" fill="#63615A" font-size="18" font-weight="550"><tspan x="104" dy="0">该删的不是上下文，而是模型能自己推断的废上下文。真正贵的是团队偏好、验</tspan><tspan x="104" dy="22">证流程和真实参考物。</tspan></text><text x="104" y="580" fill="#63615A" font-size="13" font-weight="900" text-anchor="start">COUNTERCHECK</text><rect x="104" y="598" width="100" height="30" fill="#FF6B2C" stroke="#070707" stroke-width="1" rx="8"/><text x="120" y="618" fill="#070707" font-size="15" font-weight="700" text-anchor="start">Opus 5</text><rect x="214" y="598" width="162" height="30" fill="#FF6B2C" stroke="#070707" stroke-width="1" rx="8"/><text x="230" y="618" fill="#070707" font-size="15" font-weight="700" text-anchor="start">80% prompt cut</text><rect x="386" y="598" width="153" height="30" fill="#FF6B2C" stroke="#070707" stroke-width="1" rx="8"/><text x="402" y="618" fill="#070707" font-size="15" font-weight="700" text-anchor="start">thick context</text><rect x="830" y="300" width="700" height="350" fill="#F0EEE7" stroke="#070707" stroke-width="2"/><rect x="864" y="328" width="52" height="52" fill="#D7FF3F" stroke="#070707" stroke-width="2"/><rect x="932" y="335" width="148" height="38" fill="#070707" stroke="#070707" stroke-width="2" rx="18"/><text x="1006" y="361" fill="#FBFAF6" font-size="14" font-weight="900" text-anchor="middle">02 / 运行时</text><text x="1490" y="364" fill="#070707" font-size="48" font-weight="900" text-anchor="end">94</text><text x="864" y="422" fill="#070707" font-size="25" font-weight="900"><tspan x="864" dy="0">Agent 安全从发布前评测变成运行时边界</tspan></text><text x="864" y="502" fill="#63615A" font-size="18" font-weight="550"><tspan x="864" dy="0">治理单位不再只是模型，而是身份、权限、网络、日志、审批和回滚。</tspan></text><text x="864" y="580" fill="#63615A" font-size="13" font-weight="900" text-anchor="start">COUNTERCHECK</text><rect x="864" y="598" width="135" height="30" fill="#D7FF3F" stroke="#070707" stroke-width="1" rx="8"/><text x="880" y="618" fill="#070707" font-size="15" font-weight="700" text-anchor="start">HF incident</text><rect x="1009" y="598" width="153" height="30" fill="#D7FF3F" stroke="#070707" stroke-width="1" rx="8"/><text x="1025" y="618" fill="#070707" font-size="15" font-weight="700" text-anchor="start">AISI cheating</text><rect x="1172" y="598" width="153" height="30" fill="#D7FF3F" stroke="#070707" stroke-width="1" rx="8"/><text x="1188" y="618" fill="#070707" font-size="15" font-weight="700" text-anchor="start">Agent Harness</text><rect x="70" y="700" width="700" height="350" fill="#FBFAF6" stroke="#070707" stroke-width="2"/><rect x="104" y="728" width="52" height="52" fill="#2F54FF" stroke="#070707" stroke-width="2"/><rect x="172" y="735" width="148" height="38" fill="#070707" stroke="#070707" stroke-width="2" rx="18"/><text x="246" y="761" fill="#FBFAF6" font-size="14" font-weight="900" text-anchor="middle">03 / 系统</text><text x="730" y="764" fill="#070707" font-size="48" font-weight="900" text-anchor="end">90</text><text x="104" y="822" fill="#070707" font-size="25" font-weight="900"><tspan x="104" dy="0">竞争单位变成模型、Harness、验证器和轨迹</tspan></text><text x="104" y="902" fill="#63615A" font-size="18" font-weight="550"><tspan x="104" dy="0">最强模型不是单点答案。可复盘的工作流水线，才会改写团队规模和代码产出关</tspan><tspan x="104" dy="22">系。</tspan></text><text x="104" y="980" fill="#63615A" font-size="13" font-weight="900" text-anchor="start">COUNTERCHECK</text><rect x="104" y="998" width="100" height="30" fill="#2F54FF" stroke="#070707" stroke-width="1" rx="8"/><text x="120" y="1018" fill="#070707" font-size="15" font-weight="700" text-anchor="start">Hyra</text><rect x="214" y="998" width="144" height="30" fill="#2F54FF" stroke="#070707" stroke-width="1" rx="8"/><text x="230" y="1018" fill="#070707" font-size="15" font-weight="700" text-anchor="start">Cursor Swarm</text><rect x="368" y="998" width="100" height="30" fill="#2F54FF" stroke="#070707" stroke-width="1" rx="8"/><text x="384" y="1018" fill="#070707" font-size="15" font-weight="700" text-anchor="start">Tunix</text><rect x="830" y="700" width="700" height="350" fill="#F0EEE7" stroke="#070707" stroke-width="2"/><rect x="864" y="728" width="52" height="52" fill="#18D68A" stroke="#070707" stroke-width="2"/><rect x="932" y="735" width="148" height="38" fill="#070707" stroke="#070707" stroke-width="2" rx="18"/><text x="1006" y="761" fill="#FBFAF6" font-size="14" font-weight="900" text-anchor="middle">04 / 交付物</text><text x="1490" y="764" fill="#070707" font-size="48" font-weight="900" text-anchor="end">92</text><text x="864" y="822" fill="#070707" font-size="25" font-weight="900"><tspan x="864" dy="0">入口从聊天框转向 Office、画布和设计台</tspan></text><text x="864" y="902" fill="#63615A" font-size="18" font-weight="550"><tspan x="864" dy="0">谁离最终交付物最近，谁就更容易拿到上下文、反馈和付费。聊天框只是入口之</tspan><tspan x="864" dy="22">一。</tspan></text><text x="864" y="980" fill="#63615A" font-size="13" font-weight="900" text-anchor="start">COUNTERCHECK</text><rect x="864" y="998" width="126" height="30" fill="#18D68A" stroke="#070707" stroke-width="1" rx="8"/><text x="880" y="1018" fill="#070707" font-size="15" font-weight="700" text-anchor="start">Qwen-Image</text><rect x="1000" y="998" width="126" height="30" fill="#18D68A" stroke="#070707" stroke-width="1" rx="8"/><text x="1016" y="1018" fill="#070707" font-size="15" font-weight="700" text-anchor="start">Grok Excel</text><rect x="1136" y="998" width="162" height="30" fill="#18D68A" stroke="#070707" stroke-width="1" rx="8"/><text x="1152" y="1018" fill="#070707" font-size="15" font-weight="700" text-anchor="start">Copilot Canvas</text><rect x="70" y="1100" width="700" height="350" fill="#FBFAF6" stroke="#070707" stroke-width="2"/><rect x="104" y="1128" width="52" height="52" fill="#B69CFF" stroke="#070707" stroke-width="2"/><rect x="172" y="1135" width="148" height="38" fill="#070707" stroke="#070707" stroke-width="2" rx="18"/><text x="246" y="1161" fill="#FBFAF6" font-size="14" font-weight="900" text-anchor="middle">05 / 数据</text><text x="730" y="1164" fill="#070707" font-size="48" font-weight="900" text-anchor="end">88</text><text x="104" y="1222" fill="#070707" font-size="25" font-weight="900"><tspan x="104" dy="0">下一轮训练数据红利来自真实工作轨迹</tspan></text><text x="104" y="1302" fill="#63615A" font-size="18" font-weight="550"><tspan x="104" dy="0">网页文本告诉模型世界有什么；轨迹数据告诉模型工作怎么做完。</tspan></text><text x="104" y="1380" fill="#63615A" font-size="13" font-weight="900" text-anchor="start">COUNTERCHECK</text><rect x="104" y="1398" width="153" height="30" fill="#B69CFF" stroke="#070707" stroke-width="1" rx="8"/><text x="120" y="1418" fill="#070707" font-size="15" font-weight="700" text-anchor="start">workflow data</text><rect x="267" y="1398" width="162" height="30" fill="#B69CFF" stroke="#070707" stroke-width="1" rx="8"/><text x="283" y="1418" fill="#070707" font-size="15" font-weight="700" text-anchor="start">Economic Index</text><rect x="439" y="1398" width="100" height="30" fill="#B69CFF" stroke="#070707" stroke-width="1" rx="8"/><text x="455" y="1418" fill="#070707" font-size="15" font-weight="700" text-anchor="start">Unslop</text><rect x="830" y="1100" width="700" height="350" fill="#F0EEE7" stroke="#070707" stroke-width="2"/><rect x="864" y="1128" width="52" height="52" fill="#FF8BCB" stroke="#070707" stroke-width="2"/><rect x="932" y="1135" width="148" height="38" fill="#070707" stroke="#070707" stroke-width="2" rx="18"/><text x="1006" y="1161" fill="#FBFAF6" font-size="14" font-weight="900" text-anchor="middle">06 / 基础设施</text><text x="1490" y="1164" fill="#070707" font-size="48" font-weight="900" text-anchor="end">96</text><text x="864" y="1222" fill="#070707" font-size="25" font-weight="900"><tspan x="864" dy="0">成本竞争从 token 单价扩展到工业账本</tspan></text><text x="864" y="1302" fill="#63615A" font-size="18" font-weight="550"><tspan x="864" dy="0">AI 越来越像工业系统，胜负取决于全栈单位任务成本。</tspan></text><text x="864" y="1380" fill="#63615A" font-size="13" font-weight="900" text-anchor="start">COUNTERCHECK</text><rect x="864" y="1398" width="144" height="30" fill="#FF8BCB" stroke="#070707" stroke-width="1" rx="8"/><text x="880" y="1418" fill="#070707" font-size="15" font-weight="700" text-anchor="start">Gemini Flash</text><rect x="1018" y="1398" width="100" height="30" fill="#FF8BCB" stroke="#070707" stroke-width="1" rx="8"/><text x="1034" y="1418" fill="#070707" font-size="15" font-weight="700" text-anchor="start">3.2GW</text><rect x="1128" y="1398" width="172" height="30" fill="#FF8BCB" stroke="#070707" stroke-width="1" rx="8"/><text x="1144" y="1418" fill="#070707" font-size="15" font-weight="700" text-anchor="start">AMD + Anthropic</text></svg>
