<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contra Judgment Lab · 飞书文档版 AI 周报</title><style>:root{--paper:#FBFAF6;--ink:#070707;--muted:#63615A;--line:#BDB8AD;--panel:#F0EEE7;}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif;line-height:1.6}.doc{max-width:1180px;margin:0 auto;padding:38px 28px 80px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--muted)}h1{font-size:clamp(42px,7vw,86px);line-height:1.08;max-width:980px;margin:28px 0 20px}.lead{font-size:22px;color:var(--muted);max-width:840px;margin:0 0 34px}.visual{display:block;width:100%;height:auto;border:1px solid var(--line)}.section{border-top:1px solid var(--line);padding-top:30px;margin-top:52px}.section h2{font-size:28px;margin:0 0 12px}.section p{color:var(--muted);max-width:900px}.quote{border-left:5px solid #FF6B2C;padding:12px 0 12px 20px;font-size:24px;font-weight:700;max-width:920px}@media(max-width:720px){.doc{padding:24px 16px 54px}.lead{font-size:19px}}</style></head><body><main class="doc"><div class="eyebrow">AI WEEKLY / 2026.07.21 — 07.27</div><h1>判断比执行更稀缺。</h1><p class="lead">本周六条变化：模型更强之后，真正需要被设计的是判断、边界、交付物和复盘。</p><img class="visual" src="01-cover.svg" alt="AI 周报封面"><section class="section"><h2>01 / 判断入口</h2><p>把 AI 新闻放进判断实验室：执行越来越便宜，真正稀缺的是选择、反问和验收。</p><div class="quote">Agent 价值 = 任务复杂度 × 成功率 × 可验证性 ÷ 全栈成本。</div></section><section class="section"><h2>02 / 六变量</h2><img class="visual" src="02-variable-map.svg" alt="六变量"></section><section class="section"><h2>03 / 六条趋势</h2><img class="visual" src="03-trend-cards.svg" alt="六条趋势"></section><section class="section"><h2>04 / 迁移矩阵</h2><iframe src="04-migration-chart.html" title="迁移矩阵动态可视化" style="width:100%;height:850px;border:0"></iframe></section><section class="section"><h2>05 / 结论</h2><p>把 AI 当成熟员工管理：目标、资源、边界、验证器和复盘机制，比更多噪音更重要。</p><img class="visual" src="05-wechat-header.svg" alt="公众号头图"></section></main></body></html>
