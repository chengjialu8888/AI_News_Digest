<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" aria-label="AI weekly variable field"><rect x="0" y="0" width="1600" height="1020" fill="#F0ECE1"/><text x="80" y="80" fill="#22241F" font-size="18" font-weight="800" text-anchor="start">01 / VARIABLE FIELD</text><text x="80" y="170" fill="#22241F" font-size="56" font-weight="900"><tspan x="80" dy="0">六个底层变量，正在一起改变。</tspan></text><text x="84" y="280" fill="#6A6D60" font-size="22" font-weight="520"><tspan x="84" dy="0">柱高代表本周编辑判断强度。先看哪一个约束变了，再看新闻本身。</tspan></text><rect x="80" y="370" width="1440" height="540" fill="#F0ECE1" stroke="#22241F" stroke-width="2"/><rect x="114" y="562.0" width="170" height="258.0" fill="#E78543"/><text x="114" y="432" fill="#6A6D60" font-size="18" font-weight="800" text-anchor="start">01</text><text x="114" y="474" fill="#22241F" font-size="26" font-weight="800" text-anchor="start">能力</text><text x="114" y="532.0" fill="#22241F" font-size="50" font-weight="900" text-anchor="start">86</text><text x="114" y="860" fill="#6A6D60" font-size="15" font-weight="520"><tspan x="114" dy="0">模型成熟后，prompt 噪音开</tspan><tspan x="114" dy="20">始被削掉。</tspan></text><line x1="320" y1="370" x2="320" y2="910" stroke="#E1DCCC" stroke-width="2"/><rect x="354" y="574.0" width="170" height="246.0" fill="#D6B956"/><text x="354" y="432" fill="#6A6D60" font-size="18" font-weight="800" text-anchor="start">02</text><text x="354" y="474" fill="#22241F" font-size="26" font-weight="800" text-anchor="start">成本</text><text x="354" y="544.0" fill="#22241F" font-size="50" font-weight="900" text-anchor="start">82</text><text x="354" y="860" fill="#6A6D60" font-size="15" font-weight="520"><tspan x="354" dy="0">成本从 token 扩展到吞吐、</tspan><tspan x="354" dy="20">电力、债务。</tspan></text><line x1="560" y1="370" x2="560" y2="910" stroke="#E1DCCC" stroke-width="2"/><rect x="594" y="586.0" width="170" height="234.0" fill="#5E8FD4"/><text x="594" y="432" fill="#6A6D60" font-size="18" font-weight="800" tex