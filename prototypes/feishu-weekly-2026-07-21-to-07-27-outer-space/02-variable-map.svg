<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" aria-label="AI weekly mission map"><rect x="0" y="0" width="1600" height="1020" fill="#0C1528"/><text x="80" y="80" fill="#F5F4EF" font-size="18" font-weight="800" text-anchor="start">01 / MISSION MAP</text><text x="80" y="170" fill="#F5F4EF" font-size="56" font-weight="900"><tspan x="80" dy="0">六个变量，组成一条前沿航线。</tspan></text><text x="84" y="280" fill="#AEB8CC" font-size="22" font-weight="520"><tspan x="84" dy="0">圆点大小代表本周约束变化强度。它们不是独立星体，而是一组彼此牵引的任务坐标。</tspan></text><rect x="80" y="370" width="1440" height="540" fill="#14213A" stroke="#344463" stroke-width="2"/><line x1="130" y1="640" x2="1470" y2="640" stroke="#344463" stroke-width="2"/><circle cx="150" cy="640" r="60.12" fill="#3F68D9"/><text x="150" y="646" fill="#0C1528" font-size="22" font-weight="900" text-anchor="middle">86</text><text x="88" y="520" fill="#AEB8CC" font-size="16" font-weight="800" text-anchor="start">01</text><text x="88" y="555" fill="#F5F4EF" font-size="24" font-weight="800" text-anchor="start">能力</text><text x="88" y="740" fill="#AEB8CC" font-size="14" font-weight="520"><tspan x="88" dy="0">模型成熟后，prompt 噪音开</tspan><tspan x="88" dy="18">始被削掉。</tspan></text><circle cx="385" cy="640" r="58.44" fill="#E9C35F"/><text x="385" y="646" fill="#0C1528" font-size="22" font-weight="900" text-anchor="middle">82</text><text x="323" y="520" fill="#AEB8CC" font-size="16" font-weight="800" text-anchor="start">02</text><text x="323" y="555" fill="#F5F4EF" font-size="24" font-weight="800" text-anchor="start">成本</text><text x="323" y="740" fill="#AEB8CC" font-size="14" font-weight="520"><tspan x="323" dy="0">成本从 token 扩展到吞吐、</tspan><tspan x="323" dy="18">电力、债务。</tspan></text><circle cx="610" cy="640" r="56.76" fill="#D476B1"/><text x="610" y="646" fill="#0C1528" font-size="22" font-weight="900" text-anchor="middle">78</text><text x="548" y="520" fill="#AEB8CC" font-size="16" font-weight="800" text-anchor="start">03</text><text x="548" y="555" fill="#F5F4EF" font-size="24" font-weight="800" text-anchor="start">分发</text><text x="548" y="740" fill="#AEB8CC" font-size="14" font-weight="520"><tspan x="548" dy="0">Office、画布、设计台成为</tspan><tspan x="548" dy="18">交付表面。</tspan></text><circle cx="835" cy="640" r="60.96" fill="#7C63D5"/><text x="835" y="646" fill="#0C1528" font-size="22" font-weight="900" text-anchor="middle">88</text><text x="773" y="520" fill="#AEB8CC" font-size="16" font-weight="800" text-anchor="start">04</text><text x="773" y="555" fill="#F5F4EF" font-size="24" font-weight="800" text-anchor="start">供给</text><text x="773" y="740" fill="#AEB8CC" font-size="14" font-weight="520"><tspan x="773" dy="0">芯片、电力、园区协议决定 </tspan><tspan x="773" dy="18">AI 速度。</tspan></text><circle cx="1060" cy="640" r="62.22" fill="#E9C35F"/><text x="1060" y="646" fill="#0C1528" font-size="22" font-weight="900" text-anchor="middle">91</text><text x="998" y="520" fill="#AEB8CC" font-size="16" font-weight="800" text-anchor="start">05</text><text x="998" y="555" fill="#F5F4EF" font-size="24" font-weight="800" text-anchor="start">监管</text><text x="998" y="740" fill="#AEB8CC" font-size="14" font-weight="520"><tspan x="998" dy="0">安全与版权边界进入运行时。</tspan></text><circle cx="1280" cy="640" r="59.28" fill="#3F68D9"/><text x="1280" y="646" fill="#0C1528" font-size="22" font-weight="900" text-anchor="middle">84</text><text x="1218" y="520" fill="#AEB8CC" font-size="16" font-weight="800" text-anchor="start">06</text><text x="1218" y="555" fill="#F5F4EF" font-size="24" font-weight="800" text-anchor="start">组织采用</text><text x="1218" y="740" fill="#AEB8CC" font-size="14" font-weight="520"><tspan x="1218" dy="0">Agent 需要任务、权限、检</tspan><tspan x="1218" dy="18">查点和复盘。</tspan></text></svg>
