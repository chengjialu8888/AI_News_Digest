<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1530" viewBox="0 0 1600 1530" aria-label="AI weekly mission log"><rect x="0" y="0" width="1600" height="1530" fill="#0C1528"/><text x="70" y="80" fill="#F5F4EF" font-size="18" font-weight="800" text-anchor="start">02 / MISSION LOG</text><text x="70" y="170" fill="#F5F4EF" font-size="54" font-weight="900"><tspan x="70" dy="0">六条趋势，六个正在移动的坐标。</tspan></text><text x="74" y="286" fill="#AEB8CC" font-size="22" font-weight="520" text-anchor="start">每张卡保留一个信号、一个判断、一个下一站。</text><rect x="70" y="360" width="468" height="530" fill="#14213A" stroke="#344463" stroke-width="2"/><line x1="98" y1="462" x2="510" y2="462" stroke="#344463" stroke-width="2"/><circle cx="138" cy="414" r="30" fill="#3F68D9"/><text x="138" y="421" fill="#0C1528" font-size="16" font-weight="900" text-anchor="middle">01</text><text x="190" y="420" fill="#F5F4EF" font-size="22" font-weight="800" text-anchor="start">上下文</text><text x="510" y="420" fill="#AEB8CC" font-size="26" font-weight="900" text-anchor="end">92</text><text x="98" y="524" fill="#F5F4EF" font-size="23" font-weight="850"><tspan x="98" dy="0">上下文工程从写更多规则，变成授权成</tspan><tspan x="98" dy="27">熟模型</tspan></text><text x="98" y="660" fill="#AEB8CC" font-size="16" font-weight="520"><tspan x="98" dy="0">该删的不是上下文，而是模型能自己推断的废上下文。真</tspan><tspan x="98" dy="22">正贵的是团队偏好、验证流程和真实参考物。</tspan></text><line x1="98" y1="784" x2="510" y2="784" stroke="#344463" stroke-width="2"/><text x="98" y="824" fill="#AEB8CC" font-size="13" font-weight="800" text-anchor="start">NEXT CHECKPOINT</text><text x="98" y="860" fill="#F5F4EF" font-size="16" font-weight="700" text-anchor="start">Opus 5</text><rect x="570" y="360" width="468" height="530" fill="#14213A" stroke="#344463" stroke-width="2"/><line x1="598" y1="462" x2="1010" y2="462" stroke="#344463" stroke-width="2"/><circle cx="638" cy="414" r="30" fill="#7C63D5"/><text x="638" y="421" fill="#0C1528" font-size="16" font-weight="900" text-anchor="middle">02</text><text x="690" y="420" fill="#F5F4EF" font-size="22" font-weight="800" text-anchor="start">运行时</text><text x="1010" y="420" fill="#AEB8CC" font-size="26" font-weight="900" text-anchor="end">94</text><text x="598" y="524" fill="#F5F4EF" font-size="23" font-weight="850"><tspan x="598" dy="0">Agent 安全从发布前评测变成运行时</tspan><tspan x="598" dy="27">边界</tspan></text><text x="598" y="660" fill="#AEB8CC" font-size="16" font-weight="520"><tspan x="598" dy="0">治理单位不再只是模型，而是身份、权限、网络、日志、</tspan><tspan x="598" dy="22">审批和回滚。</tspan></text><line x1="598" y1="784" x2="1010" y2="784" stroke="#344463" stroke-width="2"/><text x="598" y="824" fill="#AEB8CC" font-size="13" font-weight="800" text-anchor="start">NEXT CHECKPOINT</text><text x="598" y="860" fill="#F5F4EF" font-size="16" font-weight="700" text-anchor="start">HF incident</text><rect x="1070" y="360" width="468" height="530" fill="#14213A" stroke="#344463" stroke-width="2"/><line x1="1098" y1="462" x2="1510" y2="462" stroke="#344463" stroke-width="2"/><circle cx="1138" cy="414" r="30" fill="#E9C35F"/><text x="1138" y="421" fill="#0C1528" font-size="16" font-weight="900" text-anchor="middle">03</text><text x="1190" y="420" fill="#F5F4EF" font-size="22" font-weight="800" text-anchor="start">系统</text><text x="1510" y="420" fill="#AEB8CC" font-size="26" font-weight="900" text-anchor="end">90</text><text x="1098" y="524" fill="#F5F4EF" font-size="23" font-weight="850"><tspan x="1098" dy="0">竞争单位变成模型、Harness、验证器</tspan><tspan x="1098" dy="27">和轨迹</tspan></text><text x="1098" y="660" fill="#AEB8CC" font-size="16" font-weight="520"><tspan x="1098" dy="0">最强模型不是单点答案。可复盘的工作流水线，才会改写</tspan><tspan x="1098" dy="22">团队规模和代码产出关系。</tspan></text><line x1="1098" y1="784" x2="1510" y2="784" stroke="#344463" stroke-width="2"/><text x="1098" y="824" fill="#AEB8CC" font-size="13" font-weight="800" text-anchor="start">NEXT CHECKPOINT</text><text x="1098" y="860" fill="#F5F4EF" font-size="16" font-weight="700" text-anchor="start">Hyra</text><rect x="70" y="930" width="468" height="530" fill="#14213A" stroke="#344463" stroke-width="2"/><line x1="98" y1="1032" x2="510" y2="1032" stroke="#344463" stroke-width="2"/><circle cx="138" cy="984" r="30" fill="#D476B1"/><text x="138" y="991" fill="#0C1528" font-size="16" font-weight="900" text-anchor="middle">04</text><text x="190" y="990" fill="#F5F4EF" font-size="22" font-weight="800" text-anchor="start">交付物</text><text x="510" y="990" fill="#AEB8CC" font-size="26" font-weight="900" text-anchor="end">92</text><text x="98" y="1094" fill="#F5F4EF" font-size="23" font-weight="850"><tspan x="98" dy="0">入口从聊天框转向 Office、画布和设</tspan><tspan x="98" dy="27">计台</tspan></text><text x="98" y="1230" fill="#AEB8CC" font-size="16" font-weight="520"><tspan x="98" dy="0">谁离最终交付物最近，谁就更容易拿到上下文、反馈和付</tspan><tspan x="98" dy="22">费。聊天框只是入口之一。</tspan></text><line x1="98" y1="1354" x2="510" y2="1354" stroke="#344463" stroke-width="2"/><text x="98" y="1394" fill="#AEB8CC" font-size="13" font-weight="800" text-anchor="start">NEXT CHECKPOINT</text><text x="98" y="1430" fill="#F5F4EF" font-size="16" font-weight="700" text-anchor="start">Qwen-Image</text><rect x="570" y="930" width="468" height="530" fill="#14213A" stroke="#344463" stroke-width="2"/><line x1="598" y1="1032" x2="1010" y2="1032" stroke="#344463" stroke-width="2"/><circle cx="638" cy="984" r="30" fill="#3F68D9"/><text x="638" y="991" fill="#0C1528" font-size="16" font-weight="900" text-anchor="middle">05</text><text x="690" y="990" fill="#F5F4EF" font-size="22" font-weight="800" text-anchor="start">数据</text><text x="1010" y="990" fill="#AEB8CC" font-size="26" font-weight="900" text-anchor="end">88</text><text x="598" y="1094" fill="#F5F4EF" font-size="23" font-weight="850"><tspan x="598" dy="0">下一轮训练数据红利来自真实工作轨迹</tspan></text><text x="598" y="1230" fill="#AEB8CC" font-size="16" font-weight="520"><tspan x="598" dy="0">网页文本告诉模型世界有什么；轨迹数据告诉模型工作怎</tspan><tspan x="598" dy="22">么做完。</tspan></text><line x1="598" y1="1354" x2="1010" y2="1354" stroke="#344463" stroke-width="2"/><text x="598" y="1394" fill="#AEB8CC" font-size="13" font-weight="800" text-anchor="start">NEXT CHECKPOINT</text><text x="598" y="1430" fill="#F5F4EF" font-size="16" font-weight="700" text-anchor="start">workflow data</text><rect x="1070" y="930" width="468" height="530" fill="#14213A" stroke="#344463" stroke-width="2"/><line x1="1098" y1="1032" x2="1510" y2="1032" stroke="#344463" stroke-width="2"/><circle cx="1138" cy="984" r="30" fill="#E9C35F"/><text x="1138" y="991" fill="#0C1528" font-size="16" font-weight="900" text-anchor="middle">06</text><text x="1190" y="990" fill="#F5F4EF" font-size="22" font-weight="800" text-anchor="start">基础设施</text><text x="1510" y="990" fill="#AEB8CC" font-size="26" font-weight="900" text-anchor="end">96</text><text x="1098" y="1094" fill="#F5F4EF" font-size="23" font-weight="850"><tspan x="1098" dy="0">成本竞争从 token 单价扩展到工业账</tspan><tspan x="1098" dy="27">本</tspan></text><text x="1098" y="1230" fill="#AEB8CC" font-size="16" font-weight="520"><tspan x="1098" dy="0">AI 越来越像工业系统，胜负取决于全栈单位任务成本。</tspan></text><line x1="1098" y1="1354" x2="1510" y2="1354" stroke="#344463" stroke-width="2"/><text x="1098" y="1394" fill="#AEB8CC" font-size="13" font-weight="800" text-anchor="start">NEXT CHECKPOINT</text><text x="1098" y="1430" fill="#F5F4EF" font-size="16" font-weight="700" text-anchor="start">Gemini Flash</text></svg>
