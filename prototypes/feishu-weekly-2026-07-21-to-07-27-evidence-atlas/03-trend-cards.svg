<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1530" viewBox="0 0 1600 1530" aria-label="AI weekly evidence cards"><rect x="0" y="0" width="1600" height="1530" fill="#F4EFE4"/><text x="70" y="80" fill="#111318" font-size="18" font-weight="800" text-anchor="start">02 / EVIDENCE CARDS</text><text x="70" y="170" fill="#111318" font-size="52" font-weight="900" text-anchor="start">六条趋势，不做复述，只保留约束变化。</text><text x="74" y="248" fill="#6E665B" font-size="21" font-weight="520"><tspan x="74" dy="0">每张卡：一条判断、三条证据、一个可复盘信号。</tspan></text><rect x="70" y="300" width="700" height="350" fill="#FFF9EE" stroke="#111318" stroke-width="2"/><rect x="70" y="300" width="12" height="350" fill="#D64028"/><text x="108" y="344" fill="#6E665B" font-size="15" font-weight="800" text-anchor="start">TREND 01 / 上下文</text><text x="732" y="348" fill="#D64028" font-size="40" font-weight="900" text-anchor="end">92</text><text x="108" y="400" fill="#111318" font-size="25" font-weight="850"><tspan x="108" dy="0">上下文工程从写更多规则，变成授权成熟模型</tspan></text><text x="108" y="487" fill="#6E665B" font-size="18" font-weight="520"><tspan x="108" dy="0">该删的不是上下文，而是模型能自己推断的废上下文。真正贵的是团队偏好、验</tspan><tspan x="108" dy="22">证流程和真实参考物。</tspan></text><text x="108" y="576" fill="#6E665B" font-size="13" font-weight="800" text-anchor="start">EVIDENCE</text><rect x="108" y="595" width="100" height="30" fill="#D64028" stroke="#D64028" stroke-width="1" rx="8"/><text x="124" y="615" fill="#111318" font-size="15" font-weight="700" text-anchor="start">Opus 5</text><rect x="218" y="595" width="162" height="30" fill="#D64028" stroke="#D64028" stroke-width="1" rx="8"/><text x="234" y="615" fill="#111318" font-size="15" font-weight="700" text-anchor="start">80% prompt cut</text><rect x="390" y="595" width="153" height="30" fill="#D64028" stroke="#D64028" stroke-width="1" rx="8"/><text x="406" y="615" fill="#111318" font-size="15" font-weight="700" text-anchor="start">thick context</text><rect x="830" y="300" width="700" height="350" fill="#FFF9EE" stroke="#111318" stroke-width="2"/><rect x="830" y="300" width="12" height="350" fill="#D6A435"/><text x="868" y="344" fill="#6E665B" font-size="15" font-weight="800" text-anchor="start">TREND 02 / 运行时</text><text x="1492" y="348" fill="#D6A435" font-size="40" font-weight="900" text-anchor="end">94</text><text x="868" y="400" fill="#111318" font-size="25" font-weight="850"><tspan x="868" dy="0">Agent 安全从发布前评测变成运行时边界</tspan></text><text x="868" y="487" fill="#6E665B" font-size="18" font-weight="520"><tspan x="868" dy="0">治理单位不再只是模型，而是身份、权限、网络、日志、审批和回滚。</tspan></text><text x="868" y="576" fill="#6E665B" font-size="13" font-weight="800" text-anchor="start">EVIDENCE</text><rect x="868" y="595" width="135" height="30" fill="#D6A435" stroke="#D6A435" stroke-width="1" rx="8"/><text x="884" y="615" fill="#111318" font-size="15" font-weight="700" text-anchor="start">HF incident</text><rect x="1013" y="595" width="153" height="30" fill="#D6A435" stroke="#D6A435" stroke-width="1" rx="8"/><text x="1029" y="615" fill="#111318" font-size="15" font-weight="700" text-anchor="start">AISI cheating</text><rect x="1176" y="595" width="153" height="30" fill="#D6A435" stroke="#D6A435" stroke-width="1" rx="8"/><text x="1192" y="615" fill="#111318" font-size="15" font-weight="700" text-anchor="start">Agent Harness</text><rect x="70" y="700" width="700" height="350" fill="#FFF9EE" stroke="#111318" stroke-width="2"/><rect x="70" y="700" width="12" height="350" fill="#2459D6"/><text x="108" y="744" fill="#6E665B" font-size="15" font-weight="800" text-anchor="start">TREND 03 / 系统</text><text x="732" y="748" fill="#2459D6" font-size="40" font-weight="900" text-anchor="end">90</text><text x="108" y="800" fill="#111318" font-size="25" font-weight="850"><tspan x="108" dy="0">竞争单位变成模型、Harness、验证器和轨迹</tspan></text><text x="108" y="887" fill="#6E665B" font-size="18" font-weight="520"><tspan x="108" dy="0">最强模型不是单点答案。可复盘的工作流水线，才会改写团队规模和代码产出关</tspan><tspan x="108" dy="22">系。</tspan></text><text x="108" y="976" fill="#6E665B" font-size="13" font-weight="800" text-anchor="start">EVIDENCE</text><rect x="108" y="995" width="100" height="30" fill="#2459D6" stroke="#2459D6" stroke-width="1" rx="8"/><text x="124" y="1015" fill="#111318" font-size="15" font-weight="700" text-anchor="start">Hyra</text><rect x="218" y="995" width="144" height="30" fill="#2459D6" stroke="#2459D6" stroke-width="1" rx="8"/><text x="234" y="1015" fill="#111318" font-size="15" font-weight="700" text-anchor="start">Cursor Swarm</text><rect x="372" y="995" width="100" height="30" fill="#2459D6" stroke="#2459D6" stroke-width="1" rx="8"/><text x="388" y="1015" fill="#111318" font-size="15" font-weight="700" text-anchor="start">Tunix</text><rect x="830" y="700" width="700" height="350" fill="#FFF9EE" stroke="#111318" stroke-width="2"/><rect x="830" y="700" width="12" height="350" fill="#13865E"/><text x="868" y="744" fill="#6E665B" font-size="15" font-weight="800" text-anchor="start">TREND 04 / 交付物</text><text x="1492" y="748" fill="#13865E" font-size="40" font-weight="900" text-anchor="end">92</text><text x="868" y="800" fill="#111318" font-size="25" font-weight="850"><tspan x="868" dy="0">入口从聊天框转向 Office、画布和设计台</tspan></text><text x="868" y="887" fill="#6E665B" font-size="18" font-weight="520"><tspan x="868" dy="0">谁离最终交付物最近，谁就更容易拿到上下文、反馈和付费。聊天框只是入口之</tspan><tspan x="868" dy="22">一。</tspan></text><text x="868" y="976" fill="#6E665B" font-size="13" font-weight="800" text-anchor="start">EVIDENCE</text><rect x="868" y="995" width="126" height="30" fill="#13865E" stroke="#13865E" stroke-width="1" rx="8"/><text x="884" y="1015" fill="#111318" font-size="15" font-weight="700" text-anchor="start">Qwen-Image</text><rect x="1004" y="995" width="126" height="30" fill="#13865E" stroke="#13865E" stroke-width="1" rx="8"/><text x="1020" y="1015" fill="#111318" font-size="15" font-weight="700" text-anchor="start">Grok Excel</text><rect x="1140" y="995" width="162" height="30" fill="#13865E" stroke="#13865E" stroke-width="1" rx="8"/><text x="1156" y="1015" fill="#111318" font-size="15" font-weight="700" text-anchor="start">Copilot Canvas</text><rect x="70" y="1100" width="700" height="350" fill="#FFF9EE" stroke="#111318" stroke-width="2"/><rect x="70" y="1100" width="12" height="350" fill="#765AD8"/><text x="108" y="1144" fill="#6E665B" font-size="15" font-weight="800" text-anchor="start">TREND 05 / 数据</text><text x="732" y="1148" fill="#765AD8" font-size="40" font-weight="900" text-anchor="end">88</text><text x="108" y="1200" fill="#111318" font-size="25" font-weight="850"><tspan x="108" dy="0">下一轮训练数据红利来自真实工作轨迹</tspan></text><text x="108" y="1287" fill="#6E665B" font-size="18" font-weight="520"><tspan x="108" dy="0">网页文本告诉模型世界有什么；轨迹数据告诉模型工作怎么做完。</tspan></text><text x="108" y="1376" fill="#6E665B" font-size="13" font-weight="800" text-anchor="start">EVIDENCE</text><rect x="108" y="1395" width="153" height="30" fill="#765AD8" stroke="#765AD8" stroke-width="1" rx="8"/><text x="124" y="1415" fill="#111318" font-size="15" font-weight="700" text-anchor="start">workflow data</text><rect x="271" y="1395" width="162" height="30" fill="#765AD8" stroke="#765AD8" stroke-width="1" rx="8"/><text x="287" y="1415" fill="#111318" font-size="15" font-weight="700" text-anchor="start">Economic Index</text><rect x="443" y="1395" width="100" height="30" fill="#765AD8" stroke="#765AD8" stroke-width="1" rx="8"/><text x="459" y="1415" fill="#111318" font-size="15" font-weight="700" text-anchor="start">Unslop</text><rect x="830" y="1100" width="700" height="350" fill="#FFF9EE" stroke="#111318" stroke-width="2"/><rect x="830" y="1100" width="12" height="350" fill="#0F8AA3"/><text x="868" y="1144" fill="#6E665B" font-size="15" font-weight="800" text-anchor="start">TREND 06 / 基础设施</text><text x="1492" y="1148" fill="#0F8AA3" font-size="40" font-weight="900" text-anchor="end">96</text><text x="868" y="1200" fill="#111318" font-size="25" font-weight="850"><tspan x="868" dy="0">成本竞争从 token 单价扩展到工业账本</tspan></text><text x="868" y="1287" fill="#6E665B" font-size="18" font-weight="520"><tspan x="868" dy="0">AI 越来越像工业系统，胜负取决于全栈单位任务成本。</tspan></text><text x="868" y="1376" fill="#6E665B" font-size="13" font-weight="800" text-anchor="start">EVIDENCE</text><rect x="868" y="1395" width="144" height="30" fill="#0F8AA3" stroke="#0F8AA3" stroke-width="1" rx="8"/><text x="884" y="1415" fill="#111318" font-size="15" font-weight="700" text-anchor="start">Gemini Flash</text><rect x="1022" y="1395" width="100" height="30" fill="#0F8AA3" stroke="#0F8AA3" stroke-width="1" rx="8"/><text x="1038" y="1415" fill="#111318" font-size="15" font-weight="700" text-anchor="start">3.2GW</text><rect x="1132" y="1395" width="172" height="30" fill="#0F8AA3" stroke="#0F8AA3" stroke-width="1" rx="8"/><text x="1148" y="1415" fill="#111318" font-size="15" font-weight="700" text-anchor="start">AMD + Anthropic</text></svg>
