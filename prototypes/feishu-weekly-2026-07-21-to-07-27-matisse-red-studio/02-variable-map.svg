<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" aria-label="Matisse red studio variable studio"><rect x="0" y="0" width="1600" height="1020" fill="#F2E7E2"/><rect x="0" y="0" width="1600" height="1020" fill="#F2E7E2"/><rect x="0" y="0" width="1600" height="22" fill="#B84030"/><text x="80" y="82" fill="#86281A" font-size="18" font-weight="700" text-anchor="start">01 / VARIABLE STUDIO</text><text x="80" y="170" fill="#23110F" font-size="56" font-weight="700" text-anchor="start">六个变量，六种颜色。</text><text x="84" y="258" fill="#6B342B" font-size="22" font-weight="520"><tspan x="84" dy="0">颜色不是装饰：它标出本周最需要复核的约束。</tspan></text><rect x="80" y="330" width="450" height="280" fill="#B84030" stroke="#23110F" stroke-width="2" rx="4"/><rect x="80" y="330" width="450" height="12" fill="#852254"/><text x="108" y="384" fill="#F2E7E2" font-size="17" font-weight="700" text-anchor="start">01</text><text x="108" y="428" fill="#F2E7E2" font-size="28" font-weight="700" text-anchor="start">能力</text><text x="500" y="428" fill="#F2E7E2" font-size="48" font-weight="700" text-anchor="end">86</text><text x="108" y="480" fill="#F2E7E2" font-size="18" font-weight="520"><tspan x="108" dy="0">模型成熟后，prompt 噪音开始被削掉。</tspan></text><text x="108" y="566" fill="#F2E7E2" font-size="14" font-weight="700" text-anchor="start">SIGNAL</text><rect x="108" y="582" width="258" height="14" fill="#F2E7E2" rx="2"/><rect x="580" y="330" width="450" height="280" fill="#86281A" stroke="#23110F" stroke-width="2" rx="4"/><rect x="580" y="330" width="450" height="12" fill="#855E26"/><text x="608" y="384" fill="#F2E7E2" font-size="17" font-weight="700" text-anchor="start">02</text><text x="608" y="428" fill="#F2E7E2" font-size="28" font-weight="700" text-anchor="start">成本</text><text x="1000" y="428" fill="#F2E7E2" font-size="48" font-weight="700" text-anchor="end">82</text><text x="608" y="480" fill="#F2E7E2" font-size="18" font-weight="520"><tspan x="608" dy="0">成本从 token 扩展到吞吐、电力、债务。</tspan></text><text x="608" y="566" fill="#F2E7E2" font-size="14" font-weight="700" text-anchor="start">SIGNAL</text><rect x="608" y="582" width="246" height="14" fill="#F2E7E2" rx="2"/><rect x="1080" y="330" width="450" height="280" fill="#338247" stroke="#23110F" stroke-width="2" rx="4"/><rect x="1080" y="330" width="450" height="12" fill="#385081"/><text x="1108" y="384" fill="#F2E7E2" font-size="17" font-weight="700" text-anchor="start">03</text><text x="1108" y="428" fill="#F2E7E2" font-size="28" font-weight="700" text-anchor="start">分发</text><text x="1500" y="428" fill="#F2E7E2" font-size="48" font-weight="700" text-anchor="end">78</text><text x="1108" y="480" fill="#F2E7E2" font-size="18" font-weight="520"><tspan x="1108" dy="0">Office、画布、设计台成为交付表面。</tspan></text><text x="1108" y="566" fill="#F2E7E2" font-size="14" font-weight="700" text-anchor="start">SIGNAL</text><rect x="1108" y="582" width="234" height="14" fill="#F2E7E2" rx="2"/><rect x="80" y="660" width="450" height="280" fill="#385081" stroke="#23110F" stroke-width="2" rx="4"/><rect x="80" y="660" width="450" height="12" fill="#338247"/><text x="108" y="714" fill="#F2E7E2" font-size="17" font-weight="700" text-anchor="start">04</text><text x="108" y="758" fill="#F2E7E2" font-size="28" font-weight="700" text-anchor="start">供给</text><text x="500" y="758" fill="#F2E7E2" font-size="48" font-weight="700" text-anchor="end">88</text><text x="108" y="810" fill="#F2E7E2" font-size="18" font-weight="520"><tspan x="108" dy="0">芯片、电力、园区协议决定 AI 速度。</tspan></text><text x="108" y="896" fill="#F2E7E2" font-size="14" font-weight="700" text-anchor="start">SIGNAL</text><rect x="108" y="912" width="264" height="14" fill="#F2E7E2" rx="2"/><rect x="580" y="660" width="450" height="280" fill="#852254" stroke="#23110F" stroke-width="2" rx="4"/><rect x="580" y="660" width="450" height="12" fill="#86281A"/><text x="608" y="714" fill="#F2E7E2" font-size="17" font-weight="700" text-anchor="start">05</text><text x="608" y="758" fill="#F2E7E2" font-size="28" font-weight="700" text-anchor="start">监管</text><text x="1000" y="758" fill="#F2E7E2" font-size="48" font-weight="700" text-anchor="end">91</text><text x="608" y="810" fill="#F2E7E2" font-size="18" font-weight="520"><tspan x="608" dy="0">安全与版权边界进入运行时。</tspan></text><text x="608" y="896" fill="#F2E7E2" font-size="14" font-weight="700" text-anchor="start">SIGNAL</text><rect x="608" y="912" width="273" height="14" fill="#F2E7E2" rx="2"/><rect x="1080" y="660" width="450" height="280" fill="#855E26" stroke="#23110F" stroke-width="2" rx="4"/><rect x="1080" y="660" width="450" height="12" fill="#D868A0"/><text x="1108" y="714" fill="#F2E7E2" font-size="17" font-weight="700" text-anchor="start">06</text><text x="1108" y="758" fill="#F2E7E2" font-size="28" font-weight="700" text-anchor="start">组织采用</text><text x="1500" y="758" fill="#F2E7E2" font-size="48" font-weight="700" text-anchor="end">84</text><text x="1108" y="810" fill="#F2E7E2" font-size="18" font-weight="520"><tspan x="1108" dy="0">Agent 需要任务、权限、检查点和复盘。</tspan></text><text x="1108" y="896" fill="#F2E7E2" font-size="14" font-weight="700" text-anchor="start">SIGNAL</text><rect x="1108" y="912" width="252" height="14" fill="#F2E7E2" rx="2"/></svg>
