<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1530" viewBox="0 0 1600 1530" aria-label="Matisse red studio trend workshop"><rect x="0" y="0" width="1600" height="1530" fill="#B84030"/><rect x="0" y="0" width="1600" height="1530" fill="#B84030"/><rect x="0" y="0" width="1600" height="22" fill="#86281A"/><text x="70" y="80" fill="#F2E7E2" font-size="18" font-weight="700" text-anchor="start">02 / TREND WORKSHOP</text><text x="70" y="170" fill="#F2E7E2" font-size="52" font-weight="700" text-anchor="start">六条趋势，六次复盘。</text><text x="74" y="248" fill="#F2E7E2" font-size="21" font-weight="500" text-anchor="start">每张卡都保留：立场、证据、反问。</text><rect x="70" y="300" width="700" height="350" fill="#F1DCD9" stroke="#23110F" stroke-width="2" rx="4"/><rect x="70" y="300" width="12" height="350" fill="#852254"/><text x="108" y="344" fill="#23110F" font-size="15" font-weight="700" text-anchor="start">TREND 01 / 上下文</text><text x="732" y="348" fill="#23110F" font-size="40" font-weight="700" text-anchor="end">92</text><text x="108" y="400" fill="#23110F" font-size="25" font-weight="850"><tspan x="108" dy="0">上下文工程从写更多规则，变成授权成熟模型</tspan></text><text x="108" y="487" fill="#6B342B" font-size="18" font-weight="520"><tspan x="108" dy="0">该删的不是上下文，而是模型能自己推断的废上下文。真正贵的是团队偏好、验</tspan><tspan x="108" dy="22">证流程和真实参考物。</tspan></text><text x="108" y="576" fill="#6B342B" font-size="13" font-weight="700" text-anchor="start">COUNTERCHECK</text><rect x="108" y="595" width="100" height="30" fill="#852254" stroke="#23110F" stroke-width="1" rx="8"/><text x="124" y="615" fill="#F2E7E2" font-size="15" font-weight="700" text-anchor="start">Opus 5</text><rect x="218" y="595" width="162" height="30" fill="#852254" stroke="#23110F" stroke-width="1" rx="8"/><text x="234" y="615" fill="#F2E7E2" font-size="15" font-weight="700" text-anchor="start">80% prompt cut</text><rect x="390" y="595" width="153" height="30" fill="#852254" stroke="#23110F" stroke-width="1" rx="8"/><text x="406" y="615" fill="#F2E7E2" font-size="15" font-weight="700" text-anchor="start">thick context</text><rect x="830" y="300" width="700" height="350" fill="#DDEDE1" stroke="#23110F" stroke-width="2" rx="4"/><rect x="830" y="300" width="12" height="350" fill="#855E26"/><text x="868" y="344" fill="#23110F" font-size="15" font-weight="700" text-anchor="start">TREND 02 / 运行时</text><text x="1492" y="348" fill="#23110F" font-size="40" font-weight="700" text-anchor="end">94</text><text x="868" y="400" fill="#23110F" font-size="25" font-weight="850"><tspan x="868" dy="0">Agent 安全从发布前评测变成运行时边界</tspan></text><text x="868" y="487" fill="#6B342B" font-size="18" font-weight="520"><tspan x="868" dy="0">治理单位不再只是模型，而是身份、权限、网络、日志、审批和回滚。</tspan></text><text x="868" y="576" fill="#6B342B" font-size="13" font-weight="700" text-anchor="start">COUNTERCHECK</text><rect x="868" y="595" width="135" height="30" fill="#855E26" stroke="#23110F" stroke-width="1" rx="8"/><text x="884" y="615" fill="#F2E7E2" font-size="15" font-weight="700" text-anchor="start">HF incident</text><rect x="1013" y="595" width="153" height="30" fill="#855E26" stroke="#23110F" stroke-width="1" rx="8"/><text x="1029" y="615" fill="#F2E7E2" font-size="15" font-weight="700" text-anchor="start">AISI cheating</text><rect x="1176" y="595" width="153" height="30" fill="#855E26" stroke="#23110F" stroke-width="1" rx="8"/><text x="1192" y="615" fill="#F2E7E2" font-size="15" font-weight="700" text-anchor="start">Agent Harness</text><rect x="70" y="700" width="700" height="350" fill="#DEE3EC" stroke="#23110F" stroke-width="2" rx="4"/><rect x="70" y="700" width="12" height="350" fill="#385081"/><text x="108" y="744" fill="#23110F" font-size="15" font-weight="700" text-anchor="start">TREND 03 / 系统</text><text x="732" y="748" fill="#23110F" font-size="40" font-weight="700" text-anchor="end">90</text><text x="108" y="800" fill="#23110F" font-size="25" font-weight="850"><tspan x="108" dy="0">竞争单位变成模型、Harness、验证器和轨迹</tspan></text><text x="108" y="887" fill="#6B342B" font-size="18" font-weight="520"><tspan x="108" dy="0">最强模型不是单点答案。可复盘的工作流水线，才会改写团队规模和代码产出关</tspan><tspan x="108" dy="22">系。</tspan></text><text x="108" y="976" fill="#6B342B" font-size="13" font-weight="700" text-anchor="start">COUNTERCHECK</text><rect x="108" y="995" width="100" height="30" fill="#385081" stroke="#23110F" stroke-width="1" rx="8"/><text x="124" y="1015" fill="#F2E7E2" font-size="15" font-weight="700" text-anchor="start">Hyra</text><rect x="218" y="995" width="144" height="30" fill="#385081" stroke="#23110F" stroke-width="1" rx="8"/><text x="234" y="1015" fill="#F2E7E2" font-size="15" font-weight="700" text-anchor="start">Cursor Swarm</text><rect x="372" y="995" width="100" height="30" fill="#385081" stroke="#23110F" stroke-width="1" rx="8"/><text x="388" y="1015" fill="#F2E7E2" font-size="15" font-weight="700" text-anchor="start">Tunix</text><rect x="830" y="700" width="700" height="350" fill="#F0DAE5" stroke="#23110F" stroke-width="2" rx="4"/><rect x="830" y="700" width="12" height="350" fill="#338247"/><text x="868" y="744" fill="#23110F" font-size="15" font-weight="700" text-anchor="start">TREND 04 / 交付物</text><text x="1492" y="748" fill="#23110F" font-size="40" font-weight="700" text-anchor="end">92</text><text x="868" y="800" fill="#23110F" font-size="25" font-weight="850"><tspan x="868" dy="0">入口从聊天框转向 Office、画布和设计台</tspan></text><text x="868" y="887" fill="#6B342B" font-size="18" font-weight="520"><tspan x="868" dy="0">谁离最终交付物最近，谁就更容易拿到上下文、反馈和付费。聊天框只是入口之</tspan><tspan x="868" dy="22">一。</tspan></text><text x="868" y="976" fill="#6B342B" font-size="13" font-weight="700" text-anchor="start">COUNTERCHECK</text><rect x="868" y="995" width="126" height="30" fill="#338247" stroke="#23110F" stroke-width="1" rx="8"/><text x="884" y="1015" fill="#F2E7E2" font-size="15" font-weight="700" text-anchor="start">Qwen-Image</text><rect x="1004" y="995" width="126" height="30" fill="#338247" stroke="#23110F" stroke-width="1" rx="8"/><text x="1020" y="1015" fill="#F2E7E2" font-size="15" font-weight="700" text-anchor="start">Grok Excel</text><rect x="1140" y="995" width="162" height="30" fill="#338247" stroke="#23110F" stroke-width="1" rx="8"/><text x="1156" y="1015" fill="#F2E7E2" font-size="15" font-weight="700" text-anchor="start">Copilot Canvas</text><rect x="70" y="1100" width="700" height="350" fill="#EFE7DB" stroke="#23110F" stroke-width="2" rx="4"/><rect x="70" y="1100" width="12" height="350" fill="#86281A"/><text x="108" y="1144" fill="#23110F" font-size="15" font-weight="700" text-anchor="start">TREND 05 / 数据</text><text x="732" y="1148" fill="#23110F" font-size="40" font-weight="700" text-anchor="end">88</text><text x="108" y="1200" fill="#23110F" font-size="25" font-weight="850"><tspan x="108" dy="0">下一轮训练数据红利来自真实工作轨迹</tspan></text><text x="108" y="1287" fill="#6B342B" font-size="18" font-weight="520"><tspan x="108" dy="0">网页文本告诉模型世界有什么；轨迹数据告诉模型工作怎么做完。</tspan></text><text x="108" y="1376" fill="#6B342B" font-size="13" font-weight="700" text-anchor="start">COUNTERCHECK</text><rect x="108" y="1395" width="153" height="30" fill="#86281A" stroke="#23110F" stroke-width="1" rx="8"/><text x="124" y="1415" fill="#F2E7E2" font-size="15" font-weight="700" text-anchor="start">workflow data</text><rect x="271" y="1395" width="162" height="30" fill="#86281A" stroke="#23110F" stroke-width="1" rx="8"/><text x="287" y="1415" fill="#F2E7E2" font-size="15" font-weight="700" text-anchor="start">Economic Index</text><rect x="443" y="1395" width="100" height="30" fill="#86281A" stroke="#23110F" stroke-width="1" rx="8"/><text x="459" y="1415" fill="#F2E7E2" font-size="15" font-weight="700" text-anchor="start">Unslop</text><rect x="830" y="1100" width="700" height="350" fill="#F2E7E2" stroke="#23110F" stroke-width="2" rx="4"/><rect x="830" y="1100" width="12" height="350" fill="#D868A0"/><text x="868" y="1144" fill="#23110F" font-size="15" font-weight="700" text-anchor="start">TREND 06 / 基础设施</text><text x="1492" y="1148" fill="#23110F" font-size="40" font-weight="700" text-anchor="end">96</text><text x="868" y="1200" fill="#23110F" font-size="25" font-weight="850"><tspan x="868" dy="0">成本竞争从 token 单价扩展到工业账本</tspan></text><text x="868" y="1287" fill="#6B342B" font-size="18" font-weight="520"><tspan x="868" dy="0">AI 越来越像工业系统，胜负取决于全栈单位任务成本。</tspan></text><text x="868" y="1376" fill="#6B342B" font-size="13" font-weight="700" text-anchor="start">COUNTERCHECK</text><rect x="868" y="1395" width="144" height="30" fill="#D868A0" stroke="#23110F" stroke-width="1" rx="8"/><text x="884" y="1415" fill="#F2E7E2" font-size="15" font-weight="700" text-anchor="start">Gemini Flash</text><rect x="1022" y="1395" width="100" height="30" fill="#D868A0" stroke="#23110F" stroke-width="1" rx="8"/><text x="1038" y="1415" fill="#F2E7E2" font-size="15" font-weight="700" text-anchor="start">3.2GW</text><rect x="1132" y="1395" width="172" height="30" fill="#D868A0" stroke="#23110F" stroke-width="1" rx="8"/><text x="1148" y="1415" fill="#F2E7E2" font-size="15" font-weight="700" text-anchor="start">AMD + Anthropic</text></svg>
