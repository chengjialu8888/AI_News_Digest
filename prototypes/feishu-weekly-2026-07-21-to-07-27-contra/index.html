<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contra Lab Style · AI Weekly Visuals</title>
  <style>
    body { margin: 0; font-family: Inter, Arial, sans-serif; background: #FBFAF6; color: #070707; }
    header, section { padding: 36px; border-bottom: 2px solid #070707; }
    h1 { margin: 0 0 12px; max-width: 900px; font-size: clamp(48px, 8vw, 116px); line-height: .92; letter-spacing: 0; }
    h2 { margin: 0 0 18px; font-size: 26px; }
    p { color: #63615A; line-height: 1.6; max-width: 880px; font-size: 18px; }
    img { display: block; width: 100%; height: auto; border: 2px solid #070707; background: #FBFAF6; }
    .pill { display:inline-block; border:2px solid #070707; border-radius:999px; padding:8px 16px; font-weight:800; margin-bottom:24px; }
  </style>
</head>
<body>
  <header>
    <div class="pill">CONTRA LAB STYLE DRAFT</div>
    <h1>Judgment Layer for AI Weekly</h1>
    <p>白底、黑线、大标题、创意评测卡和高密度矩阵。用于确认风格方向，暂不覆盖已有飞书文档。</p>
  </header>
  <section><h2>飞书文档封面主图</h2><img src="01-cover.svg" alt="飞书文档封面主图"></section>
<section><h2>六变量 Scoreboard</h2><img src="02-variable-map.svg" alt="六变量 Scoreboard"></section>
<section><h2>六趋势 Creative Eval Cards</h2><img src="03-trend-cards.svg" alt="六趋势 Creative Eval Cards"></section>
<section><h2>行业迁移矩阵</h2><img src="04-migration-matrix.svg" alt="行业迁移矩阵"></section>
<section><h2>公众号头图复用版</h2><img src="05-wechat-header.svg" alt="公众号头图复用版"></section>
</body>
</html>
